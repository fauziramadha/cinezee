<!DOCTYPE html>
<html>
<head>
    <title>Clearing Cache...</title>
</head>
<body>
    <h1>Clearing Service Worker...</h1>
    <p id="status">Working...</p>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister();
                    console.log('Service Worker unregistered:', registration.scope);
                }
                document.getElementById('status').innerText = 'Success! Cache cleared. You can close this page and open cinestream.my.id again.';
            }).catch(function(err) {
                document.getElementById('status').innerText = 'Failed: ' + err;
            });
        } else {
            document.getElementById('status').innerText = 'No Service Worker found.';
        }
    </script>
</body>
</html>

name: Deploy PartyKit

on:
  push:
    branches: [main]
    paths:
      - 'src/party/**'
      - 'partykit.json'
      - '.github/workflows/deploy-partykit.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PartyKit CLI
        run: npm install -g partykit

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Deploy to Cloudflare (Cloud-Prem)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx partykit deploy --domain cinezee-watch-party.fauziramadhani4321.workers.dev
